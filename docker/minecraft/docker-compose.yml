services:
  mc-server:
    container_name: 'minecraft-server'
    image: itzg/minecraft-server:latest
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      INIT_MEMORY: "4G"
      MAX_MEMORY: "8G"
      MOTD: "duck do whatta duck do"
    volumes:
      - ./minecraft.server:/data
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G